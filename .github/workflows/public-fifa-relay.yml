name: Public FIFA OBB Relay Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-fifa-relay.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary FIFA transfer storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' > /tmp/artifact_ids.txt || true
          while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done < /tmp/artifact_ids.txt
          gh release delete fifa16-obb-relay-temp --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          echo 'Temporary FIFA relay artifacts and release removed.'
