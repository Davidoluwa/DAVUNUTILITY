name: Public FIFA OBB Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-fifa-relay.yml'
      - '.github/fifa-offset.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read transfer offset
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          START=$(tr -dc '0-9' < .github/fifa-offset.txt)
          test -n "$START"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "name=fifa16-transfer-offset-${START}" >> "$GITHUB_OUTPUT"

      - name: Free repository artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' > /tmp/artifact_ids.txt || true
          while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done < /tmp/artifact_ids.txt

      - name: Resolve MediaFire and download verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > direct_url.txt
          import html, re, urllib.request
          page='https://www.mediafire.com/file/ycxkoqne89x35zh/FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip/file'
          req=urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req, timeout=45).read().decode('utf-8','ignore')
          m=re.search(r'href=["\'](https://download\d+\.mediafire\.com/[^"\']+)["\']', text)
          if not m: raise SystemExit('direct URL not found')
          print(html.unescape(m.group(1)))
          PY
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --user-agent 'Mozilla/5.0' "$(cat direct_url.txt)" -o fifa16.zip
          test "$(stat -c%s fifa16.zip)" -eq 1408809061
          echo '7bd9d0bd7018dc1a1642d0f24198c9a6e7a222ff0f96d8ea1a9181411afa5c5f  fifa16.zip' | sha256sum -c -

      - name: Build transfer chunk
        shell: bash
        run: |
          set -euo pipefail
          START=${{ steps.cfg.outputs.start }}
          TOTAL=$(stat -c%s fifa16.zip)
          OFFSET=$((START * 1024 * 1024))
          test "$OFFSET" -lt "$TOTAL"
          dd if=fifa16.zip of=fifa16.chunk bs=1M skip="$START" count=192 status=none
          sha256sum fifa16.chunk
          stat -c '%s bytes' fifa16.chunk

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.name }}
          path: fifa16.chunk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
