name: Public FIFA OBB Relay

on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-fifa-relay.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve MediaFire and download verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > direct_url.txt
          import html, re, urllib.request
          page='https://www.mediafire.com/file/ycxkoqne89x35zh/FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip/file'
          req=urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req, timeout=45).read().decode('utf-8','ignore')
          m=re.search(r'href=["\'](https://download\d+\.mediafire\.com/[^"\']+)["\']', text)
          if not m: raise SystemExit('direct URL not found')
          print(html.unescape(m.group(1)))
          PY
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --user-agent 'Mozilla/5.0' "$(cat direct_url.txt)" -o fifa16.zip
          test "$(stat -c%s fifa16.zip)" -eq 1408809061
          echo '7bd9d0bd7018dc1a1642d0f24198c9a6e7a222ff0f96d8ea1a9181411afa5c5f  fifa16.zip' | sha256sum -c -
      - name: Build tiny transfer probe
        shell: bash
        run: |
          head -c 4194304 fifa16.zip | base64 -w76 > fifa16-part-00-probe.b64.txt
      - name: Upload tiny transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa16-transfer-probe
          path: fifa16-part-00-probe.b64.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
