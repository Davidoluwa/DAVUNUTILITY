name: Temporary GANI Viewer v2b x86 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-gani-viewer-v2b-x86.yml'

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recover base source
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/Davidoluwa/DAVUNUTILITY/5f704ce7dd14941d1bd0e19ba1e605de2a0850e4/temp_gani_viewer/source.zip.b64'
          $b64 = (Invoke-WebRequest -UseBasicParsing $url).Content.Trim()
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive source.zip -DestinationPath gani-viewer-src -Force

      - name: Replay self-contained rig and Explorer-drop patch
        shell: pwsh
        run: |
          $lines = Get-Content '.github/workflows/temp-gani-viewer-v2-x86.yml'
          $start = ($lines | Select-String -SimpleMatch '      - name: Patch v2 self-contained rig and Explorer drop').LineNumber - 1
          if ($start -lt 0) { throw 'Patch source step not found' }
          $run = -1
          for ($i=$start; $i -lt $lines.Count; $i++) { if ($lines[$i] -eq '        run: |') { $run=$i+1; break } }
          if ($run -lt 0) { throw 'Patch run block not found' }
          $out = New-Object System.Collections.Generic.List[string]
          for ($i=$run; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('      - name: ')) { break }
            if ($lines[$i].StartsWith('          ')) { $out.Add($lines[$i].Substring(10)) } else { $out.Add($lines[$i]) }
          }
          Set-Content -Encoding UTF8 extracted_patch.sh $out
          & 'C:\Program Files\Git\bin\bash.exe' --noprofile --norc -e -o pipefail extracted_patch.sh

      - name: Replace path reader with Unicode Win32 reader
        shell: pwsh
        run: |
          $p = 'gani-viewer-src/src/main.cpp'
          $s = Get-Content -Raw $p
          $a = $s.IndexOf('static std::wstring win32LongPath')
          $b = $s.IndexOf('template<class T>', $a)
          if ($a -lt 0 -or $b -lt 0) { throw 'Reader block not found' }
          $reader = @'
          static std::vector<uint8_t> readFile(const fs::path&p){
              std::wstring wp=p.wstring();
              HANDLE h=CreateFileW(wp.c_str(),GENERIC_READ,FILE_SHARE_READ|FILE_SHARE_WRITE|FILE_SHARE_DELETE,nullptr,OPEN_EXISTING,FILE_ATTRIBUTE_NORMAL,nullptr);
              if(h==INVALID_HANDLE_VALUE) throw std::runtime_error("Unable to open file (Win32 error "+std::to_string(GetLastError())+")");
              LARGE_INTEGER sz{};
              if(!GetFileSizeEx(h,&sz)||sz.QuadPart<=0||sz.QuadPart>0x7fffffffLL){DWORD e=GetLastError();CloseHandle(h);throw std::runtime_error("Invalid/empty file (Win32 error "+std::to_string(e)+")");}
              std::vector<uint8_t> data(static_cast<size_t>(sz.QuadPart));
              size_t done=0;
              while(done<data.size()){
                  DWORD want=DWORD(std::min<size_t>(data.size()-done,1u<<20)),got=0;
                  if(!ReadFile(h,data.data()+done,want,&got,nullptr)||got==0){DWORD e=GetLastError();CloseHandle(h);throw std::runtime_error("Read failed (Win32 error "+std::to_string(e)+")");}
                  done+=got;
              }
              CloseHandle(h);
              return data;
          }
          '@
          $s = $s.Substring(0,$a) + $reader + "`r`n" + $s.Substring($b)
          Set-Content -NoNewline -Encoding UTF8 $p $s

      - name: Configure Win32
        shell: pwsh
        run: cmake -S gani-viewer-src -B build -G "Visual Studio 18 2026" -A Win32

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify genuine PE32 x86 executable
        shell: pwsh
        run: |
          $exe = 'build/Release/GANIViewer.exe'
          if (!(Test-Path $exe)) { throw 'GANIViewer.exe missing' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          Write-Host ('PE machine = 0x{0:X4}' -f $machine)
          Write-Host ('Optional-header magic = 0x{0:X4}' -f $magic)
          Write-Host ('Size = {0} bytes' -f $bytes.Length)
          if ($machine -ne 0x14c) { throw 'Not IMAGE_FILE_MACHINE_I386' }
          if ($magic -ne 0x10b) { throw 'Not PE32' }
          New-Item -ItemType Directory package | Out-Null
          Copy-Item $exe package/GANIViewer-v2.exe
          Copy-Item gani-viewer-src/README.md package/README.md
          Copy-Item -Recurse gani-viewer-src package/source

      - uses: actions/upload-artifact@v4
        with:
          name: GANIViewer-v2b-Win32-x86
          path: package
          if-no-files-found: error
          retention-days: 1
