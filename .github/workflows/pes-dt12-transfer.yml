name: Temporary PES dt12 transfer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pes-dt12-transfer.yml'

permissions:
  contents: read

jobs:
  probe-jina:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct ModsFire endpoint through Jina
        run: |
          set -euxo pipefail
          U='https://r.jina.ai/https://modsfire.com/d/xnbcgig635r24UH'
          curl -A 'Mozilla/5.0' -sS -D /tmp/h.txt -o /tmp/body.txt -w 'HTTP=%{http_code}\nEFFECTIVE=%{url_effective}\nTYPE=%{content_type}\nSIZE=%{size_download}\nREDIRS=%{num_redirects}\n' -L "$U" || true
          cat /tmp/h.txt || true
          echo '--- BODY ---'
          head -c 30000 /tmp/body.txt || true
          echo
