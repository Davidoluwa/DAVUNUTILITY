name: Temporary PES dt12 transfer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pes-dt12-transfer.yml'

permissions:
  contents: read

jobs:
  fetch-dt12:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unar
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Resolve Flashbang download and fetch archive
        run: |
          cat > fetch-dt12.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function tryDownload(page, locator, out) {
            try {
              const p = page.waitForEvent('download', { timeout: 20000 });
              await locator.click({ timeout: 10000 });
              const d = await p;
              console.log('DOWNLOAD:', d.suggestedFilename());
              await d.saveAs(out);
              return true;
            } catch (e) {
              console.log('download attempt failed:', String(e));
              return false;
            }
          }

          (async() => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            let page = await context.newPage();
            const url = 'https://flashbang.sh/f/GSUgLG-0oAA';
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            console.log('TITLE:', await page.title());

            const entries = await page.locator('a,button').evaluateAll(els => els.map(e => ({
              tag:e.tagName,
              text:(e.innerText||e.textContent||'').trim(),
              href:e.href||'',
              download:e.getAttribute('download')||''
            })));
            console.log('LINKS/BUTTONS', JSON.stringify(entries, null, 2));

            let saved = false;
            for (let attempt = 0; attempt < 5 && !saved; attempt++) {
              const pages = context.pages();
              page = pages[0] || page;
              for (const extra of pages.slice(1)) {
                try { await extra.close(); } catch {}
              }

              const candidates = page.locator('a,button').filter({ hasText: /download/i });
              const n = await candidates.count();
              console.log('attempt', attempt, 'download candidates', n);
              for (let i = 0; i < n && !saved; i++) {
                saved = await tryDownload(page, candidates.nth(i), '/tmp/update.rar');
                if (!saved) {
                  await page.waitForTimeout(1200);
                }
              }
              if (!saved) {
                try { await page.reload({ waitUntil:'domcontentloaded', timeout:60000 }); } catch {}
                await page.waitForTimeout(1800);
              }
            }

            if (!saved) {
              const hrefs = await page.locator('a').evaluateAll(as => as.map(a => a.href).filter(Boolean));
              console.log('FINAL HREFS', JSON.stringify(hrefs, null, 2));
              fs.writeFileSync('/tmp/page.html', await page.content());

              // Try direct-looking URLs discovered in the DOM.
              const direct = hrefs.find(h => /\.rar($|\?)/i.test(h) || /download|\/dl\//i.test(h));
              if (direct) {
                console.log('DIRECT CANDIDATE', direct);
                const r = await context.request.get(direct, { timeout: 120000 });
                console.log('DIRECT STATUS', r.status(), r.headers());
                if (r.ok()) {
                  fs.writeFileSync('/tmp/update.rar', await r.body());
                  saved = true;
                }
              }
            }

            if (!saved || !fs.existsSync('/tmp/update.rar')) {
              throw new Error('Could not trigger or resolve the archive download');
            }

            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node ./fetch-dt12.js
          ls -lh /tmp/update.rar
          stat -c 'ARCHIVE_BYTES=%s' /tmp/update.rar

      - name: Inspect archive and extract dt12_g4.cpk
        run: |
          7z l /tmp/update.rar | tee /tmp/archive-list.txt
          mkdir -p /tmp/dt12
          7z e -y /tmp/update.rar -o/tmp/dt12 '*dt12_g4.cpk'
          CPK=$(find /tmp/dt12 -type f -iname 'dt12_g4.cpk' -print -quit)
          test -n "$CPK"
          stat -c 'CPK_BYTES=%s' "$CPK" | tee /tmp/cpk-info.txt
          sha256sum "$CPK" | tee -a /tmp/cpk-info.txt
          xxd -l 32 "$CPK" | tee -a /tmp/cpk-info.txt
          mkdir -p /tmp/chunks
          split -b 200M -d -a 2 "$CPK" /tmp/chunks/dt12_g4.cpk.part
          ls -lh /tmp/chunks | tee -a /tmp/cpk-info.txt
          sha256sum /tmp/chunks/* | tee /tmp/chunk-sha256.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: dt12-meta
          path: |
            /tmp/cpk-info.txt
            /tmp/chunk-sha256.txt
            /tmp/archive-list.txt
          compression-level: 9

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part00
          path: /tmp/chunks/dt12_g4.cpk.part00
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part01
          path: /tmp/chunks/dt12_g4.cpk.part01
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part02
          path: /tmp/chunks/dt12_g4.cpk.part02
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part03
          path: /tmp/chunks/dt12_g4.cpk.part03
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part04
          path: /tmp/chunks/dt12_g4.cpk.part04
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part05
          path: /tmp/chunks/dt12_g4.cpk.part05
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part06
          path: /tmp/chunks/dt12_g4.cpk.part06
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part07
          path: /tmp/chunks/dt12_g4.cpk.part07
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part08
          path: /tmp/chunks/dt12_g4.cpk.part08
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with:
          name: dt12-part09
          path: /tmp/chunks/dt12_g4.cpk.part09
          compression-level: 0
          if-no-files-found: ignore
