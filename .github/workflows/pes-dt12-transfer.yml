name: Temporary PES dt12 transfer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pes-dt12-transfer.yml'

permissions:
  contents: read

jobs:
  probe-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct ModsFire endpoint safely
        run: |
          set -euxo pipefail
          U='https://modsfire.com/d/xnbcgig635r24UH'
          echo '--- HEAD ---'
          curl -A 'Mozilla/5.0' -sSIL --max-redirs 10 "$U" || true
          echo '--- RANGE 0-1023 ---'
          curl -A 'Mozilla/5.0' -sS -D /tmp/h.txt -H 'Range: bytes=0-1023' -L --max-redirs 10 -o /tmp/prefix.bin -w 'HTTP=%{http_code}\nEFFECTIVE=%{url_effective}\nTYPE=%{content_type}\nSIZE=%{size_download}\nREDIRS=%{num_redirects}\n' "$U" || true
          cat /tmp/h.txt || true
          file /tmp/prefix.bin || true
          stat -c 'PREFIX_BYTES=%s' /tmp/prefix.bin || true
          xxd -l 128 /tmp/prefix.bin || true
