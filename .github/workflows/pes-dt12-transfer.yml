name: Temporary PES dt12 transfer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pes-dt12-transfer.yml'

permissions:
  contents: read

jobs:
  dump-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dump rendered ModsFire second stage
        run: |
          set -euxo pipefail
          U='https://r.jina.ai/https://modsfire.com/download/xnbcgig635r24UH/00f75'
          curl -A 'Mozilla/5.0' -sS -o /tmp/body.txt -L "$U"
          echo '--- BODY ---'
          cat /tmp/body.txt
