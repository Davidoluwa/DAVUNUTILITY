name: Temporary PES cleanup

on:
  push:
    paths:
      - '.github/workflows/pes-transfer.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary transfer release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pes-transfer-20260913
          REPO: Davidoluwa/DAVUNUTILITY
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
