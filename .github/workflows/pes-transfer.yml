name: Temporary PES artifact cleanup

on:
  push:
    paths:
      - '.github/workflows/pes-transfer.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: Davidoluwa/DAVUNUTILITY
        shell: bash
        run: |
          set -euo pipefail
          for id in 10316485352 10316415522 10316161108 10315797207 10316460356; do
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id" || true
          done
