name: Temporary Gemma Release Relay
on:
  push:
    paths:
      - '.github/workflows/fifa16_attribdb_tool_pull.yml'
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify official Gemma GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 -o gemma-4-E4B_q4_0-it.gguf 'https://eu-central.storage.cloudconvert.com/tasks/d0262eaf-36bf-44c1-b245-b6240235b732/gemma-4-E4B_q4_0-it.gguf?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20261005%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20261005T144240Z&X-Amz-Expires=86400&X-Amz-Signature=8594638eda0b59028ae953b40308d347c652705d87d4640341d572350cf32803&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22gemma-4-E4B_q4_0-it.gguf%22&x-amz-checksum-mode=ENABLED&x-id=GetObject'
          test "$(stat -c%s gemma-4-E4B_q4_0-it.gguf)" -eq 5154941280
          echo '09f6f2a1d9ff4a1b7db9cc1aad9c55a9df2f5ec133327a92eab593fcf4360ed0  gemma-4-E4B_q4_0-it.gguf' | sha256sum -c -
      - name: Split into release-safe pieces
        shell: bash
        run: |
          set -euo pipefail
          split -b 1800M -d -a 2 gemma-4-E4B_q4_0-it.gguf gemma-4-E4B_q4_0-it.gguf.part
          sha256sum gemma-4-E4B_q4_0-it.gguf.part* > SHA256SUMS.txt
          ls -lh gemma-4-E4B_q4_0-it.gguf.part* SHA256SUMS.txt
      - name: Publish temporary release
        shell: bash
        run: |
          set -euo pipefail
          TAG='gemma-relay-temp-20261005'
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title 'Temporary Gemma 4 E4B Relay' --notes 'Temporary transport release for Gemma 4 E4B Q4_0 GGUF.'
          gh release upload "$TAG" gemma-4-E4B_q4_0-it.gguf.part* SHA256SUMS.txt
