name: Temporary Gemma Relay
on:
  push:
    paths:
      - '.github/workflows/fifa16_attribdb_tool_pull.yml'
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official Gemma 4 E4B GGUF
        shell: bash
        run: |
          set -euo pipefail
          URL='https://huggingface.co/google/gemma-4-E4B-it-qat-q4_0-gguf/resolve/ce70163b5df4580cf3534f9f373f15c6c6a6c4e9/gemma-4-E4B_q4_0-it.gguf?download=true'
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 -o gemma-4-E4B_q4_0-it.gguf "$URL"
          test "$(stat -c%s gemma-4-E4B_q4_0-it.gguf)" -eq 5154941280
          echo '09f6f2a1d9ff4a1b7db9cc1aad9c55a9df2f5ec133327a92eab593fcf4360ed0  gemma-4-E4B_q4_0-it.gguf' | sha256sum -c -
      - name: Upload Gemma relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-4-e4b-relay
          path: gemma-4-E4B_q4_0-it.gguf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
