# trigger corrected checkpoint relay
name: Temporary Gemma Release Relay
on:
  push:
    paths:
      - '.github/workflows/fifa16_attribdb_tool_pull.yml'
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify current official Gemma GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 -o gemma-4-E4B_q4_0-it.gguf 'https://huggingface.co/google/gemma-4-E4B-it-qat-q4_0-gguf/resolve/main/gemma-4-E4B_q4_0-it.gguf?download=true'
          test "$(stat -c%s gemma-4-E4B_q4_0-it.gguf)" -eq 5154941280
          echo '676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee  gemma-4-E4B_q4_0-it.gguf' | sha256sum -c -
      - name: Split into release-safe pieces
        shell: bash
        run: |
          set -euo pipefail
          split -b 1800M -d -a 2 gemma-4-E4B_q4_0-it.gguf gemma-4-E4B_q4_0-it.gguf.part
          sha256sum gemma-4-E4B_q4_0-it.gguf.part* > SHA256SUMS.txt
      - name: Publish temporary release
        shell: bash
        run: |
          set -euo pipefail
          TAG='gemma-relay-temp-20261005'
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title 'Temporary Gemma 4 E4B Relay' --notes 'Temporary transport release for Gemma 4 E4B Q4_0 GGUF.'
          gh release upload "$TAG" gemma-4-E4B_q4_0-it.gguf.part* SHA256SUMS.txt
